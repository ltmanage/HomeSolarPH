# CI/CD for HomeSolarPH.
#   CI (every push and pull request): lint, tests, requirements check, smoke test of the running app.
#   CD (only after CI passes): pull request -> Vercel preview; push to main -> Vercel production.
# Deploy jobs skip themselves until the Vercel secrets (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) exist.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERCEL_CLI: vercel@65.0.0

jobs:
  checks:
    name: Lint, tests and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .
      - name: Tests
        run: uv run pytest -q
      - name: requirements.txt matches uv.lock
        run: bash tools/check_requirements.sh
      - name: Smoke test (start the app and load each page)
        run: |
          # Run uvicorn from the venv directly (not via `uv run`) so no uv process holds the cache lock.
          .venv/bin/uvicorn index:app --port 8040 > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid
          trap 'kill $(cat /tmp/uvicorn.pid) 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8040/api/health >/dev/null && break; sleep 1; done
          for p in / /check /quotes /guide /guide/questions /about /api/health /static/style.css; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8040$p")
            echo "$p -> $code"; [ "$code" = "200" ] || exit 1
          done
          curl -fs -X POST http://127.0.0.1:8040/check \
            -d "region=NCR&provider=meralco&bill_php=9000&kwh_month=600&daytime=mixed&net_metering=yes" | grep -q "Your solar estimate"
          echo "Solar check flow OK"

  deploy-preview:
    name: Deploy preview (pull request)
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel secrets
        id: gate
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets not set; skipping preview deploy."
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.ok == 'true'
      - name: Deploy preview
        if: steps.gate.outputs.ok == 'true'
        run: |
          npx --yes "$VERCEL_CLI" pull --yes --environment=preview --token="$VERCEL_TOKEN"
          url=$(npx --yes "$VERCEL_CLI" deploy --token="$VERCEL_TOKEN")
          echo "Preview: $url" | tee -a "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy production (main)
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Check Vercel secrets
        id: gate
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets not set; skipping production deploy."
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.ok == 'true'
      - name: Deploy production
        if: steps.gate.outputs.ok == 'true'
        run: |
          npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
          url=$(npx --yes "$VERCEL_CLI" deploy --prod --token="$VERCEL_TOKEN")
          echo "Deployment: $url" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check the live site
        if: steps.gate.outputs.ok == 'true' && env.PRODUCTION_URL != ''
        run: |
          for i in $(seq 1 10); do
            if curl -fs "$PRODUCTION_URL/api/health" | tee /tmp/health.json; then break; fi
            sleep 6
          done
          grep -q '"status":"ok"' /tmp/health.json
          echo "Live health check OK: $PRODUCTION_URL" | tee -a "$GITHUB_STEP_SUMMARY"
