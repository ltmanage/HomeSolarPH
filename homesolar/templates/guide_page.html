{% extends "base.html" %}
{% block title %}{{ p.title }}{% endblock %}
{% block content %}
<p class="crumbs"><a href="/guide">Installer guide</a> ›</p>
<h1>{{ p.title }}</h1>
<article class="prose">{{ p.html|safe }}</article>
<section class="actions">
  <button class="btn" id="print">Print this page</button>
  {% for o in pages if o.slug != p.slug %}<a class="btn" href="/guide/{{ o.slug }}">{{ o.title }}</a>{% endfor %}
</section>
{% include "_feedback.html" %}
{% endblock %}
{% block scripts %}<script src="/static/common.js?v={{ version }}"></script>{% endblock %}
