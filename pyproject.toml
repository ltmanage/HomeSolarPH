[project]
name = "homesolarph"
version = "0.1.0"
description = "Neutral rooftop solar decision resource for Philippine homeowners"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "markdown>=3.6",
]

[dependency-groups]
dev = ["pytest>=8.3", "uvicorn>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
